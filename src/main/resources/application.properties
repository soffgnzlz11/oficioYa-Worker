spring.application.name=worker

# Credenciales por variables de entorno (ver README). Sin valores por defecto: si faltan, la app no arranca.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT: la clave debe ser la misma que usa Identity para firmar (minimo 32 caracteres)
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# true = los GET de consulta (catalogo, trabajadores, disponibilidad, fotos) no exigen token
security.public-queries=${PUBLIC_QUERIES:false}

logging.file.name=logs/worker.log
